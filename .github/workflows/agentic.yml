name: Agentic Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation-check:
    name: documentation-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun for standalone documentation checks
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate OS2 metadata and portable tooling
        run: bun run check:ci

  release-vite-chunk-check:
    name: release-vite-chunk-check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Install npm dependencies
        run: npm ci
      - name: Run release Vite chunk gate
        run: mise run release-vite-chunk-check
