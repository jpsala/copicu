[package]
name = "copicu"
version = "0.5.8"
description = "A local keyboard-first clipboard manager inspired by CopyQ."
authors = ["JP"]
edition = "2021"
default-run = "copicu"
autobins = false

[features]
default = ["shared-clipboard"]
shared-clipboard-n1 = [
  "windows/Win32_Graphics_Gdi",
  "windows/Win32_Security_Cryptography",
  "windows/Win32_System_JobObjects"
]
shared-clipboard = [
  "dep:chacha20poly1305",
  "dep:ed25519-dalek",
  "dep:hpke",
  "dep:reqwest",
  "dep:rustls",
  "dep:rustls-platform-verifier",
  "windows/Win32_Security_Cryptography",
  "windows/Win32_System_JobObjects"
]

[lib]
name = "copicu_lib"
crate-type = ["rlib"]

[[bin]]
name = "copicu"
path = "src/main.rs"

[[example]]
name = "shared-clipboard-n1"
path = "examples/shared_clipboard_n1.rs"
required-features = ["shared-clipboard-n1"]

[[example]]
name = "shared-clipboard-product"
path = "examples/shared_clipboard_product.rs"
required-features = ["shared-clipboard-n1", "shared-clipboard"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-global-shortcut = "2.3.2"
base64 = "0.22"
clipboard-rs = "0.3.4"
rusqlite = { version = "0.39.0", features = ["bundled", "functions", "hooks", "limits"] }
rusqlite_migration = "=2.5.0"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
unicode-normalization = "=0.1.24"
caseless = "0.2.2"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"], optional = true }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"], optional = true }
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "x25519", "chacha", "aes"], optional = true }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "blocking", "rustls-no-provider"], optional = true }
rustls = { version = "=0.23.40", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "=0.7.0", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
