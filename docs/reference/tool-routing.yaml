# Portable routing policy for Copicu
version: 14
scope: copicu-agentic
policy: traycer_native_intent_first

runtime:
  control_plane: traycer
  harness: codex
  fallback_harness: omp
  fallback_mode: manual_only
  daily_entry: conversation
  package_extension: none
  prompts: none
  lifecycle_prompt: none
  current_session: true

intent:
  discuss:
    action: answer_or_investigate
    edits: false
  plan:
    action: produce_plan
    execute: false
  implement:
    action: current_session_direct
  persist:
    action: durable_value_once

execution:
  default_model: codex_medium
  high_only_for:
    - material_ambiguity
    - open_architecture
    - security_or_privacy
    - irreversibility
    - production
    - hard_to_detect_material_failure
  unavailable: fail_closed_without_fallback
  automatic_fallback: false
  automatic_new_session: false
  automatic_send: false

coordination:
  agents: explicit_user_request_only
  todos: multistep_work
  subagents: explicit_user_request_and_independent_slices_only
  handoff: demand_only
  worktrees: isolated_for_concurrency_only

workflow:
  implementation:
    tools: native_harness

approval:
  mode: single_batch_envelope
  local_reversible: proceed
  require_for:
    - install
    - commit
    - push
    - deploy
    - production
    - credentials
    - private_data
    - destructive
    - external_send
    - visible_ui_input

computer:
  tool: omp_builtin
  config: omp_config
  product_dependency: none
  inspection: read_only
  input: approval_required
  target: exactly_one_window
  accessibility: preferred_but_not_sole_webview_oracle
  coordinates: latest_screenshot_same_target
  focus_oracle_c0:
    sequence: external_foreground_type_visible_token
    manual_focus_before_type: forbidden

local_resources:
  allowed:
    - omp_config
    - docs_skills
    - agents_skills
    - research_command
  wrappers:
    computer: forbidden
    flow: forbidden

checks:
  minimum_sufficient: true
  nonduplicated: true
  routing_command: routing_check

gates:
  human_confirmation:
    - install
    - commit
    - push
    - deploy
    - production
    - credentials
    - private_data
    - destructive
    - external_send
    - visible_ui_input
