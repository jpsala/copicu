# AOS flow-first routing policy for Copicu
version: 1

flow:
  daily_entry: /flow
  contract: aos.flow-first@1.1.0
  source: user/package global AOS_HOME
  phases: [Pensar, Planear, Hacer, Cerrar]
  handoff: new linked session, documentary and reviewable
  auto_send: false
  agent: explicit user request only
  max_batches: 1
  plan_role: scope guidance, not exhaustive checklist
  focus_states: [needs_planning, ready, blocked, complete, waiting_gate]
  model_routing:
    source: selected_plan_frontmatter
    field: execution_route
    default: balanced
    economical: openai-codex/gpt-5.6-luna@high
    balanced: openai-codex/gpt-5.6-sol@medium
    strong: openai-codex/gpt-5.6-sol@high
    application: replacement_session_reload_before_handoff
    visibility: prompt_and_notification
    unavailable: fail_closed_without_fallback
    classifier: none
    terra: excluded_until_local_evidence

local_adapters:
  allowed:
    - .pi/extensions/copicu-computer-use.ts
    - .pi/prompts/release-windows.md
    - .pi/prompts/research.md
    - docs/skills/
    - .pi/taskflows/
  flow_copy: forbidden

checks:
  minimum_sufficient: true
  nonduplicated: true
  routing_command: bun run routing:check

gates:
  human_confirmation:
    - install
    - commit
    - push
    - deploy
    - production
    - credentials
    - private_data
    - destructive
    - external_send
